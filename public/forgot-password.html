<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SharkTrade Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="api.js"></script>
    <script src="toast.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #000; color: #fff; font-family: 'Segoe UI', sans-serif;
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card { width: 100%; max-width: 400px; background: #050709; border: 1px solid rgba(200,168,106,0.3); border-radius: 14px; padding: 32px 26px; }
        h2 { margin: 0 0 6px; font-size: 1.3rem; }
        p.subtitle { color: #888; font-size: 0.82rem; margin: 0 0 24px; line-height: 1.5; }
        label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 6px; }
        input {
            width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff;
            padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem;
        }
        ul#passwordRules { list-style:none; padding:0; margin: -8px 0 16px; font-size:0.72rem; display:flex; flex-wrap:wrap; gap:8px; }
        ul#passwordRules li { color: #666; }
        .submit-btn {
            width: 100%; padding: 13px; background: #c8a86a; border: none; border-radius: 8px;
            font-weight: 800; color: #000; cursor: pointer; font-size: 0.9rem;
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .step { display: none; }
        .step.active { display: block; }
        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 0.8rem; color: #c8a86a; text-decoration: none; }
        .demo-note { background: rgba(200,168,106,0.08); border: 1px solid rgba(200,168,106,0.25); border-radius: 10px; padding: 12px 16px; font-size: 0.78rem; color: #c8a86a; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Reset Your Password</h2>

    <!-- STEP 1: Request code -->
    <div class="step active" id="step1">
        <p class="subtitle">Enter the email associated with your account and we'll send a 6-digit reset code.</p>
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" required>
        <button class="submit-btn" id="requestBtn" onclick="requestCode()">Send Reset Code</button>
    </div>

    <!-- STEP 2: Enter code + new password -->
    <div class="step" id="step2">
        <div class="demo-note" id="simulatedNote" style="display:none;"></div>
        <p class="subtitle">Enter the 6-digit code sent to your email, and choose a new password.</p>
        <label for="resetCode">Reset Code</label>
        <input type="text" id="resetCode" maxlength="6" placeholder="123456" required>
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required>
        <ul id="passwordRules">
            <li data-rule="length"><i class="fa-solid fa-circle-xmark"></i> 8+ characters</li>
            <li data-rule="upper"><i class="fa-solid fa-circle-xmark"></i> Uppercase</li>
            <li data-rule="lower"><i class="fa-solid fa-circle-xmark"></i> Lowercase</li>
            <li data-rule="number"><i class="fa-solid fa-circle-xmark"></i> Number</li>
            <li data-rule="special"><i class="fa-solid fa-circle-xmark"></i> Special character</li>
        </ul>
        <button class="submit-btn" id="resetBtn" onclick="submitReset()">Reset Password</button>
    </div>

    <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
</div>

<script>
    let resetEmail = '';

    async function requestCode() {
        resetEmail = document.getElementById('resetEmail').value.trim();
        if (!resetEmail) { showToast('Please enter your email.', 'warning'); return; }

        const btn = document.getElementById('requestBtn');
        btn.disabled = true;
        btn.textContent = 'Sending...';

        try {
            const data = await apiRequest('/api/auth/forgot-password', {
                method: 'POST', auth: false, body: { email: resetEmail }
            });

            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');

            if (data.simulatedCode) {
                const note = document.getElementById('simulatedNote');
                note.style.display = 'block';
                note.innerHTML = `<i class="fa-solid fa-circle-info"></i> No email service is configured yet, so here's your code directly: <strong>${data.simulatedCode}</strong>`;
            } else {
                showToast('Reset code sent — check your email.', 'success');
            }
        } catch (err) {
            showToast(err.message || 'Failed to send reset code.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Send Reset Code';
        }
    }

    async function submitReset() {
        const code = document.getElementById('resetCode').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const btn = document.getElementById('resetBtn');

        if (!code || !newPassword) { showToast('Please fill in both fields.', 'warning'); return; }

        btn.disabled = true;
        btn.textContent = 'Resetting...';

        try {
            await apiRequest('/api/auth/reset-password', {
                method: 'POST', auth: false, body: { email: resetEmail, code, newPassword }
            });
            showToast('Password updated! Redirecting to sign in...', 'success');
            setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (err) {
            showToast(err.message || 'Failed to reset password.', 'error');
            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }
    }

    document.getElementById('newPassword').addEventListener('input', function() {
        const val = this.value;
        const checks = {
            length: val.length >= 8, upper: /[A-Z]/.test(val), lower: /[a-z]/.test(val),
            number: /\d/.test(val), special: /[^A-Za-z0-9]/.test(val)
        };
        Object.keys(checks).forEach(rule => {
            const li = document.querySelector(`#passwordRules li[data-rule="${rule}"]`);
            const icon = li.querySelector('i');
            if (checks[rule]) { li.style.color = '#00e676'; icon.className = 'fa-solid fa-circle-check'; }
            else { li.style.color = '#666'; icon.className = 'fa-solid fa-circle-xmark'; }
        });
    });
</script>

</body>
</html>
