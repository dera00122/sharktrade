<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Plans Overview | SharkTrade Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="api.js"></script>
    <script src="chat-widget.js"></script>
    <script src="language-switcher.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        .plan-card {
            background: #050709; border: 1px solid #333; border-radius: 14px;
            padding: 22px; margin-bottom: 18px;
        }
        .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .plan-name { font-size: 1.15rem; font-weight: 800; color: #c8a86a; }
        .plan-roi-badge { background: rgba(0,230,118,0.12); color: #00e676; font-size: 0.8rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; }

        .plan-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; margin-bottom: 6px; }
        .plan-detail-item .label { font-size: 0.68rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .plan-detail-item .value { font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 3px; }

        .invest-btn {
            width: 100%; padding: 12px; margin-top: 18px; background: #c8a86a;
            border: none; border-radius: 8px; color: #000; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="dashboard.html" style="color:#c8a86a; text-decoration:none; font-size: 0.85rem;">&larr; BACK TO DASHBOARD</a>
    <h2 style="margin: 20px 0 4px;">Investment Plans Overview</h2>
    <p style="color:#888; font-size:0.85rem; margin-top:0; margin-bottom:26px;">Full details for every plan — investment range, daily ROI, platform fee, lock-in period, and withdrawal frequency.</p>

    <div id="plansContainer">
        <p style="text-align:center; color:#666;">Loading plans...</p>
    </div>
</div>

<script>
    function renderPlans(plans) {
        const container = document.getElementById('plansContainer');

        if (plans.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#666;">No investment plans are currently available.</p>`;
            return;
        }

        container.innerHTML = plans.map(plan => {
            const fee = plan.fee_percent || 0;
            const lockDays = plan.lock_days || 0;

            return `
                <div class="plan-card">
                    <div class="plan-header">
                        <span class="plan-name">${plan.name}</span>
                        <span class="plan-roi-badge">${plan.daily_roi}% / day</span>
                    </div>

                    <div class="plan-detail-grid">
                        <div class="plan-detail-item">
                            <div class="label">Investment Range</div>
                            <div class="value">$${formatMoney(plan.min_amount)}${plan.max_amount ? ' - $' + formatMoney(plan.max_amount) : '+'}</div>
                        </div>
                        <div class="plan-detail-item">
                            <div class="label">Platform Fee</div>
                            <div class="value">${fee}%</div>
                        </div>
                        <div class="plan-detail-item">
                            <div class="label">Lock-in Period</div>
                            <div class="value">${lockDays > 0 ? lockDays + ' days' : 'None'}</div>
                        </div>
                        <div class="plan-detail-item">
                            <div class="label">Profit Withdrawal</div>
                            <div class="value">${plan.withdrawal_type === 'daily' ? 'Daily' : 'Every 48hrs'}</div>
                        </div>
                    </div>

                    <a href="investment.html"><button class="invest-btn">Invest in ${plan.name}</button></a>
                </div>
            `;
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
        if (!requireLogin()) return;
        try {
            const { plans } = await apiRequest('/api/user/plans');
            renderPlans(plans);
        } catch (err) {
            document.getElementById('plansContainer').innerHTML = `<p style="text-align:center; color:#ff5252;">Failed to load investment plans.</p>`;
        }
    });
</script>

</body>
</html>
