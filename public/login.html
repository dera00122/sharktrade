<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access Gateway — SharkTrade Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 2. SPLIT LAYOUT ENGIN  */
        .split-screen {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Side: Premium Media Banner Panel (Matches Registration) */
        .left-banner {
            flex: 1.2;
            position: relative;
            background: url('7729ff99e28af539a2959697b06dab30.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
        }

        .left-banner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, #000000 100%);
            z-index: 1;
        }

        .banner-text-content {
            position: relative;
            z-index: 2;
            max-width: 500px;
        }

        .banner-text-content h2 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 16px;
            color: #FFFFFF;
        }

        .banner-text-content p {
            color: #A0A5B1;
            font-size: 1.1rem;
            line-height: 1.6;
        }

    
        .right-form-panel {
            flex: 1;
            background-color: #050709;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
        }

        .back-hub-btn {
            position: absolute;
            top: 40px;
            right: 80px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6C727F;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
            z-index: 10;
        }

        .back-hub-btn:hover {
            color: #c8a86a;
        }

        .form-container-box {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .brand-header {
            margin-bottom: 36px;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: #c8a86a;
        }

        .brand-header p {
            color: #6C727F;
            font-size: 0.95rem;
        }

        /* 3. FORM INPUTS & UTILITIES*/
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-wrapper label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #A0A5B1;
        }

        .input-field-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-container i {
            position: absolute;
            left: 16px;
            color: #4A4E57;
            font-size: 1.1rem;
            transition: color 0.2s;
            pointer-events: none;
        }

        .input-field-container input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 16px 16px 16px 48px;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-field-container input:focus {
            border-color: #c8a86a;
            background-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 3px rgba(200, 168, 106, 0.15);
        }

        .input-field-container input:focus + i {
            color: #c8a86a;
        }

        
        .form-utility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .remember-me-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #A0A5B1;
            cursor: pointer;
            user-select: none;
        }

        .remember-me-toggle input {
            accent-color: #c8a86a;
        }

        .forgot-pass-link {
            color: #c8a86a;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-pass-link:hover {
            text-decoration: underline;
        }

        
        .submit-execution-btn {
            background-color: #c8a86a;
            color: #000000;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 8px;
            box-shadow: 0 8px 24px rgba(200, 168, 106, 0.2);
        }

        .submit-execution-btn:hover {
            background-color: #e0bc7a;
            transform: translateY(-1px);
        }

        .switch-portal-prompt {
            text-align: center;
            font-size: 0.9rem;
            color: #6C727F;
            margin-top: 12px;
        }

        .switch-portal-prompt a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .switch-portal-prompt a:hover {
            color: #c8a86a;
        }

        /*4. RESPONSIVE BREAKPOINTS (MOBILE-FIRST FALLBACK*/
        @media (max-width: 1024px) {
            .right-form-panel {
                padding: 60px 40px;
            }
            .back-hub-btn {
                right: 40px;
            }
        }

        @media (max-width: 850px) {
            .left-banner {
                display: none;
            }
            .right-form-panel {
                flex: 1;
                min-height: 100vh;
                padding: 80px 24px;
            }
            .back-hub-btn {
                top: 30px;
                right: 24px;
            }
        }
    </style>
    <script src="api.js"></script>
</head>
<body>

<div class="split-screen">
    
    <aside class="left-banner">
        <div class="banner-text-content">
            <h2>Ride the Waves of Institutional Capital.</h2>
            <p>Deploy secure system nodes, execute automated schemas, and monitor portfolio telemetry with zero frictional overhead.</p>
        </div>
    </aside>

    <main class="right-form-panel">
        <a href="index.html" class="back-hub-btn"><i class="fa-solid fa-xmark"></i> Close</a>

        <div class="form-container-box">
            <header class="brand-header">
                <div class="brand-logo">SharkTrade <span>Pro</span></div>
                <p>Provide your credentials to establish secure session access.</p>
            </header>

            <form class="login-form" action="dashboard.html" method="POST">
                
                <div class="input-wrapper">
                    <label for="loginEmail">Secure Identifier (Email)</label>
                    <div class="input-field-container">
                        <input type="email" id="loginEmail" placeholder="fchidera398@gmail.com" required autocomplete="email">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label for="loginPassword">Access Key (Password)</label>
                    <div class="input-field-container">
                        <input type="password" id="loginPassword" placeholder="Enter your passkey" required autocomplete="current-password">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>

                <div class="form-utility-row">
                    <label class="remember-me-toggle">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember access node</span>
                    </label>
                    <a href="#" class="forgot-pass-link">Forgot Key?</a>
                </div>

                <button type="submit" class="submit-execution-btn">Authorize Session</button>

                <p class="switch-portal-prompt">Don't have an account? <a href="register.html">Register here</a></p>
            </form>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const emailField = document.getElementById('loginEmail');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        
        const rememberedEmail = localStorage.getItem('rememberedUserEmail');
        if (rememberedEmail) {
            emailField.value = rememberedEmail;
            rememberMeCheckbox.checked = true;
        } else {
            
            const savedEmail = localStorage.getItem('registeredEmail');
            if (savedEmail) {
                emailField.value = savedEmail;
            }
        }

        // 2. Routing & Authentication Form Processor
        const loginForm = document.querySelector('.login-form');
        const submitBtn = document.querySelector('.submit-execution-btn');

        if (loginForm) {
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const emailInput = emailField.value.trim();
                const passwordInput = document.getElementById('loginPassword').value;

                // --- REMEMBER ME CHECKBOX ENGINE ---
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('rememberedUserEmail', emailInput);
                } else {
                    localStorage.removeItem('rememberedUserEmail');
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Authorizing...";

                try {
                    const data = await apiRequest('/api/auth/login', {
                        method: 'POST',
                        body: { email: emailInput, password: passwordInput },
                        auth: false
                    });

                    if (data.user.role === 'admin') {
                        alert('Admin accounts must sign in through the admin portal, not this page.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Authorize Session";
                        return;
                    }

                    setSession(data.token, data.user);
                    localStorage.removeItem('registeredEmail');

                    window.location.href = 'dashboard.html';
                } catch (err) {
                    alert(err.message || "Login failed. Please check your credentials.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Authorize Session";
                }
            });
        }
    });
</script>

    <script src="chat-widget.js"></script>
</body>
</html>
